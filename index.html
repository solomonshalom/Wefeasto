<!DOCTYPE html>
<!--
  Wefeasto — maintenance page. The real site is parked as home.html /
  home-recipe.html; see README.md for how to wake it back up.
  404.html is a copy of this file, so old URLs land here too.
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We&rsquo;re cooking &lt;33 &middot; Wefeasto</title>
    <meta name="description" content="Our site&rsquo;s getting a fresh coat. Back very soon.">
    <!-- temporary page: keep it out of the index so the real site keeps its rankings -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f7f1e8">
    <!-- quietly re-check every 5 minutes so open tabs pick the site back up on their own -->
    <meta http-equiv="refresh" content="300">

    <meta property="og:type" content="website">
    <meta property="og:title" content="We&rsquo;re cooking &lt;33">
    <meta property="og:description" content="Our site&rsquo;s getting a fresh coat. Back very soon.">
    <meta property="og:image" content="assets/images/cooking.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="assets/images/wefeasto.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #f7f1e8;
            --ink: #171310;
            --muted: #756b60;
            --orange: #ff8243;
        }

        * { box-sizing: border-box }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: var(--cream);
            color: var(--ink);
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            height: 100svh;
        }

        /* grid items default to min-height:auto, which lets the photo's
           intrinsic aspect ratio push the track past the viewport */
        .split > * {
            min-width: 0;
            min-height: 0;
        }

        .photo {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #3a2517;
        }

        .say {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: clamp(24px, 5vw, 80px);
        }

        h1 {
            margin: 0;
            font-size: clamp(1.85rem, 3.9vw, 3.35rem);
            font-weight: 500;
            line-height: 1.12;
            letter-spacing: -.022em;
            text-wrap: balance;
        }

        .heart {
            display: inline-block;
            color: var(--orange);
            animation: beat 2.6s ease-in-out infinite;
        }

        /* a double thump, like the real thing */
        @keyframes beat {
            0%, 30%, 100% { transform: scale(1) }
            8%  { transform: scale(1.1) }
            19% { transform: scale(1.06) }
        }

        .line {
            max-width: 52ch;
            margin: clamp(14px, 1.7vw, 22px) 0 0;
            font-size: clamp(.92rem, 1.05vw, 1.02rem);
            font-weight: 300;
            line-height: 1.6;
            color: var(--muted);
            text-wrap: balance;
        }

        /* stacked halves on phones — still 50/50 */
        @media (max-width: 820px) {
            .split {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }

            .say {
                align-items: center;
                text-align: center;
            }

            h1 { font-size: clamp(1.75rem, 7.6vw, 2.9rem) }
            .line { font-size: clamp(.88rem, 3.7vw, 1rem) }
        }

        @media (prefers-reduced-motion: reduce) {
            .heart { animation: none }
        }
    </style>
</head>

<body>
    <main class="split">
        <img class="photo" src="assets/images/cooking.jpg" fetchpriority="high"
            alt="A glass of Wefeasto granola set in a bed of oats, nuts, seeds and dried fruit">

        <div class="say">
            <h1>We&rsquo;re cooking <span class="heart">&lt;33</span></h1>
            <p class="line">Our site&rsquo;s getting a fresh coat &mdash; back very soon.</p>
        </div>
    </main>
</body>

</html>
