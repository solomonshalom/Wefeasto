<!DOCTYPE html>
<!--
  Wefeasto — maintenance page. The real site is parked as home.html /
  home-recipe.html; see README.md for how to wake it back up.
  404.html is a copy of this file, so old URLs land here too.
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooking &lt;3 &middot; Wefeasto</title>
    <meta name="description" content="Wefeasto is cooking something up. Back soon.">
    <!-- temporary page: keep it out of the index so the real site keeps its rankings -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f7f1e8">
    <!-- quietly re-check every 5 minutes so open tabs pick the site back up on their own -->
    <meta http-equiv="refresh" content="300">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Cooking &lt;3">
    <meta property="og:description" content="Wefeasto is cooking something up. Back soon.">
    <meta property="og:image" content="assets/images/cooking.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="assets/images/wefeasto.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #f7f1e8;
            --ink: #171310;
            --orange: #ff8243;
        }

        * { box-sizing: border-box }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: var(--cream);
            color: var(--ink);
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            height: 100svh;
        }

        /* grid items default to min-height:auto, which lets the photo's
           intrinsic aspect ratio push the track past the viewport */
        .split > * {
            min-width: 0;
            min-height: 0;
        }

        .photo {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #1c1613;
        }

        .say {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: clamp(24px, 5vw, 80px);
        }

        .logo {
            position: absolute;
            top: clamp(24px, 4.5vw, 56px);
            left: clamp(24px, 5vw, 80px);
            width: clamp(112px, 11vw, 150px);
            height: auto;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.9rem, 7.4vw, 6.75rem);
            font-weight: 600;
            line-height: 1;
            letter-spacing: -.025em;
        }

        .heart {
            display: inline-block;
            margin-left: -.06em;
            color: var(--orange);
            animation: beat 2.6s ease-in-out infinite;
        }

        /* a double thump, like the real thing */
        @keyframes beat {
            0%, 30%, 100% { transform: scale(1) }
            8%  { transform: scale(1.1) }
            19% { transform: scale(1.06) }
        }

        /* stacked halves on phones — still 50/50 */
        @media (max-width: 820px) {
            .split {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }

            .say {
                align-items: center;
                text-align: center;
            }

            .logo {
                position: static;
                width: 126px;
                margin-bottom: clamp(18px, 4.5vw, 30px);
            }

            h1 { font-size: clamp(2.6rem, 13vw, 4.5rem) }
        }

        @media (prefers-reduced-motion: reduce) {
            .heart { animation: none }
        }
    </style>
</head>

<body>
    <main class="split">
        <img class="photo" src="assets/images/cooking.jpg" fetchpriority="high"
            alt="A jar of Wefeasto oats layered with yoghurt and blackberries">

        <div class="say">
            <img class="logo" src="assets/images/wefeasto.png" width="150" height="37" alt="Wefeasto">
            <h1>Cooking <span class="heart">&lt;3</span></h1>
        </div>
    </main>
</body>

</html>
